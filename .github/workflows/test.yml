# Runs acceptance tests against an ephemeral Clerk application.
# The CLERK_PLATFORM_API_KEY secret must be set in the repository settings.
name: Acceptance Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  acceptance:
    needs: build
    # Fork PRs never receive repository secrets, so the acceptance run would
    # fail before compiling a single test. Skip it there; maintainers run it
    # via the safe-to-test label (see acceptance-fork.yml).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        run: go test ./internal/provider/ -v -timeout 300s
        env:
          TF_ACC: "1"
          CLERK_PLATFORM_API_KEY: ${{ secrets.CLERK_PLATFORM_API_KEY }}
