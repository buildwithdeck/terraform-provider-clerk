# Runs acceptance tests against an ephemeral Clerk application.
# The CLERK_PLATFORM_API_KEY secret must be set in the repository settings.
name: Acceptance Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build and test only read the repo; nothing here writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  acceptance:
    needs: build
    # Fork PRs never receive repository secrets, so the acceptance run would
    # fail before compiling a single test. Skip it there; maintainers run it
    # via the safe-to-test label (see acceptance-fork.yml).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        run: go test ./internal/provider/ -v -timeout 300s
        env:
          TF_ACC: "1"
          CLERK_PLATFORM_API_KEY: ${{ secrets.CLERK_PLATFORM_API_KEY }}
